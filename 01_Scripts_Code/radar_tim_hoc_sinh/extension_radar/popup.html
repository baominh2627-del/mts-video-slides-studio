<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; margin: 0; padding: 12px; background: #0f172a; color: #e2e8f0; font: 13px/1.45 system-ui, sans-serif; }
    h3 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .status { padding: 7px 9px; border-radius: 8px; background: #1e293b; margin-bottom: 8px; font-size: 12.5px; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 9px; margin-bottom: 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0; }
    select { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 4px 6px; font: inherit; }
    button { width: 100%; padding: 8px 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #334155; background: #2563eb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.sec { background: #1e293b; font-weight: 500; }
    button.ok { background: #16a34a; border-color: #16a34a; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .recent { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
    .ev { padding: 5px 7px; border-radius: 7px; background: #0f172a; border-left: 3px solid #475569; font-size: 11.5px; }
    .ev.hit { border-left-color: #22c55e; background: #052e1688; }
    .muted { color: #94a3b8; font-size: 11.5px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h3>📡 Radar Tìm Học Sinh v3</h3>
  <div id="status" class="status">Đang kiểm tra kết nối...</div>

  <div class="box">
    <div class="row">
      <span>Chế độ canh:</span>
      <select id="mode">
        <option value="rotate">🔄 Chế độ 1: Xoay vòng Group</option>
        <option value="manual">🖐 Chế độ 2: Thủ công khi lướt</option>
      </select>
    </div>
    <div class="row" id="row-interval">
      <span>Mỗi nhóm cách nhau:</span>
      <select id="interval">
        <option value="45">45 giây</option>
        <option value="60">60 giây (Khuyên dùng)</option>
        <option value="90">90 giây</option>
        <option value="120">2 phút</option>
        <option value="180">3 phút</option>
      </select>
    </div>
    <div id="watch-info" class="muted"></div>
  </div>

  <button id="add-current" class="ok hidden">➕ Tích chọn luôn Nhóm đang mở này</button>
  <button id="open-groups">☑️ Tích chọn các Nhóm để canh (<span id="grp-count">0</span> nhóm)</button>

  <div class="btn-grid">
    <button id="step-now" class="sec">⏭ Chuyển nhóm ngay</button>
    <button id="scan-now" class="sec">🔍 Quét trang này</button>
  </div>
  <button id="open-app" class="sec">📱 Mở App Radar HS (Web/PC)</button>

  <div class="box" style="margin-top:8px; margin-bottom:0;">
    <div style="font-weight:600; font-size:12px;">📋 Nhật ký đọc bài vừa xong:</div>
    <div id="recent" class="recent"><span class="muted">Chưa có bài mới trong phiên này.</span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
